<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Main Construction Safety Helmet / Building Crest -->
  <g filter="url(#shadow)" transform="translate(4, 4)">
    <!-- Shield / Badge Base -->
    <path d="M 252 80 C 330 80 400 110 400 170 C 400 290 320 380 252 420 C 184 380 104 290 104 170 C 104 110 174 80 252 80 Z" fill="url(#primaryGrad)"/>

    <!-- Hammer & Attendance Check Graphic -->
    <!-- Hard Hat Arc -->
    <path d="M 140 210 C 140 140 190 110 252 110 C 314 110 364 140 364 210 Z" fill="url(#accentGrad)"/>
    
    <!-- Helmet Rim -->
    <path d="M 120 210 C 120 205 130 200 150 200 L 354 200 C 374 200 384 205 384 210 C 384 220 370 226 350 226 L 154 226 C 134 226 120 220 120 210 Z" fill="#d97706"/>

    <!-- Center Crest: Attendance Checkmark in Pure White -->
    <circle cx="252" cy="290" r="64" fill="#ffffff" opacity="0.95"/>
    <path d="M 224 290 L 244 310 L 286 266" fill="none" stroke="#1d4ed8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
